<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch: {{ skill_title }} - AI Job Readiness Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #0a0a0a;
            color: white;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .video-container {
            flex: 1;
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .progress-bar-container {
            background: #1a1a2e;
            padding: 15px 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .progress-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }
        .progress-track {
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a855f7);
            width: {{ progress }}%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }
        .complete-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .complete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(16,185,129,0.4);
        }
    </style>
</head>
<body>
    <div class="video-container">
        <iframe id="youtubePlayer"
            src="https://www.youtube.com/embed/{{ video_id }}?enablejsapi=1&rel=0&modestbranding=1&playsinline=1"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
        </iframe>
    </div>
    
    <div class="progress-bar-container">
        <div class="container-fluid">
            <div class="row align-items-center">
                <div class="col">
                    <div class="progress-label">
                        <span><i class="fab fa-youtube me-2" style="color: #ff0000;"></i>{{ skill_title }}</span>
                        <span id="progressPercent">{{ progress }}% completed</span>
                    </div>
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill" style="width: {{ progress }}%"></div>
                    </div>
                </div>
                <div class="col-auto">
                    <button class="complete-btn" onclick="markComplete()">
                        <i class="fas fa-check-circle me-2"></i>Mark Complete
                    </button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;
        let currentProgress = {{ progress }};
        let saveInterval;
        let duration = 0;
        
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('youtubePlayer', {
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }
        
        function onPlayerReady(event) {
            duration = player.getDuration();
            if (currentProgress > 0 && currentProgress < 100) {
                const seekTime = (currentProgress / 100) * duration;
                player.seekTo(seekTime, true);
            }
        }
        
        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                saveInterval = setInterval(saveProgress, 5000);
            } else {
                clearInterval(saveInterval);
                saveProgress();
            }
        }
        
        function saveProgress() {
            if (!player || !duration) return;
            
            const currentTime = player.getCurrentTime();
            const percent = Math.min(100, Math.floor((currentTime / duration) * 100));
            
            if (percent > currentProgress) {
                currentProgress = percent;
                document.getElementById('progressFill').style.width = currentProgress + '%';
                document.getElementById('progressPercent').innerText = currentProgress + '% completed';
                
                fetch('/api/update-video-progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        skill: '{{ skill_name }}',
                        progress: currentProgress
                    })
                }).catch(console.error);
            }
        }
        
        function markComplete() {
            currentProgress = 100;
            document.getElementById('progressFill').style.width = '100%';
            document.getElementById('progressPercent').innerText = '100% completed - Great job!';
            
            fetch('/api/update-video-progress', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    skill: '{{ skill_name }}',
                    progress: 100
                })
            }).then(() => {
                setTimeout(() => window.close(), 1500);
            });
        }
        
        window.addEventListener('beforeunload', function() {
            if (saveInterval) clearInterval(saveInterval);
            saveProgress();
        });
    </script>
</body>
</html>
