<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Questionnaire - AI Job Readiness Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 50px 0;
        }
        
        .question-card {
            background: white;
            border-radius: 30px;
            padding: 40px;
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        
        .progress-bar-custom {
            height: 8px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }
        
        .option-label {
            display: block;
            padding: 15px 20px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #1e293b;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .option-label:hover {
            background: linear-gradient(135deg, rgba(102,126,234,0.1), rgba(118,75,162,0.1));
            border-color: #667eea;
            transform: translateX(5px);
        }
        
        input[type="radio"]:checked + .option-label {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: #667eea;
            color: white;
        }
        
        input[type="radio"] {
            display: none;
        }
        
        .btn-next {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 14px;
            border-radius: 50px;
            font-weight: 600;
            border: none;
            width: 100%;
            transition: all 0.3s ease;
        }
        
        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.3);
        }
        
        .btn-next:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        h2 {
            color: white;
            font-weight: 700;
        }
        
        .text-white-50 {
            color: rgba(255,255,255,0.8) !important;
        }
        
        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: #1e293b;
        }
        
        .container {
            max-width: 800px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="text-center mb-4">
                    <h2>Career Interest Questionnaire</h2>
                    <p class="text-white-50">Help us understand your interests and strengths</p>
                </div>
                
                <div class="progress-bar-custom">
                    <div class="progress-fill" id="progressFill" style="width: 0%"></div>
                </div>
                
                <div id="questionsContainer"></div>
                
                <button class="btn-next" id="nextBtn" onclick="nextQuestion()">
                    Next <i class="fas fa-arrow-right ms-2"></i>
                </button>
            </div>
        </div>
    </div>
    
    <script>
        const questions = [
            {
                text: "What type of work do you enjoy most?",
                options: [
                    "💻 Building websites and applications",
                    "📊 Working with data and analytics",
                    "☁️ Managing infrastructure and cloud systems",
                    "🎨 Designing user experiences and interfaces"
                ]
            },
            {
                text: "How do you prefer to solve problems?",
                options: [
                    "✏️ Writing code and algorithms",
                    "📈 Analyzing data patterns",
                    "🏗️ Building scalable systems",
                    "👥 Collaborating with teams"
                ]
            },
            {
                text: "Which subject interests you the most?",
                options: [
                    "💻 Programming and Development",
                    "📐 Mathematics and Statistics",
                    "🚀 Cloud Computing and DevOps",
                    "📋 Product Strategy"
                ]
            },
            {
                text: "What's your ideal work environment?",
                options: [
                    "🎯 Deep focus on coding",
                    "📊 Data-driven decision making",
                    "⚙️ System architecture and optimization",
                    "🤝 Cross-functional collaboration"
                ]
            }
        ];
        
        let currentQuestion = 0;
        let answers = [];
        
        function loadQuestion() {
            const container = document.getElementById('questionsContainer');
            const q = questions[currentQuestion];
            
            container.innerHTML = `
                <div class="question-card">
                    <div class="question-text">${currentQuestion + 1}. ${q.text}</div>
                    ${q.options.map((opt, idx) => `
                        <div>
                            <input type="radio" name="question" value="${opt}" id="opt${idx}">
                            <label for="opt${idx}" class="option-label">${opt}</label>
                        </div>
                    `).join('')}
                </div>
            `;
            
            if (answers[currentQuestion]) {
                const radio = document.querySelector(`input[value="${answers[currentQuestion]}"]`);
                if (radio) radio.checked = true;
            }
            
            const progress = ((currentQuestion + 1) / questions.length) * 100;
            document.getElementById('progressFill').style.width = `${progress}%`;
            
            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestion === questions.length - 1) {
                nextBtn.innerHTML = 'Submit <i class="fas fa-check ms-2"></i>';
            } else {
                nextBtn.innerHTML = 'Next <i class="fas fa-arrow-right ms-2"></i>';
            }
        }
        
        function nextQuestion() {
            const selected = document.querySelector('input[name="question"]:checked');
            if (!selected) {
                alert('Please select an answer');
                return;
            }
            
            answers[currentQuestion] = selected.value;
            
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                loadQuestion();
            } else {
                submitQuestionnaire();
            }
        }
        
        async function submitQuestionnaire() {
            const btn = document.getElementById('nextBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i> Analyzing...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/analyze-questionnaire', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ answers: answers })
                });
                
                const data = await response.json();
                sessionStorage.setItem('suggestedRoles', JSON.stringify(data.roles));
                window.location.href = '/suggested-roles';
            } catch (error) {
                console.error('Error:', error);
                alert('Error submitting questionnaire. Please try again.');
                btn.innerHTML = 'Submit <i class="fas fa-check ms-2"></i>';
                btn.disabled = false;
            }
        }
        
        loadQuestion();
    </script>
</body>
</html>
